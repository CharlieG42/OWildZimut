name: o_wild_zimut
description: "Outil de creation de cartes de Course d'Orientation avec gestion avancee de calques."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 0.0.006+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icones de style iOS
  cupertino_icons: ^1.0.8

  # Selection de fichiers multiplateforme (import OMAP, import d'images de fond)
  file_selector: ^1.0.3

  # Acces a des repertoires standards (sauvegardes de projets)
  path_provider: ^2.1.1

  # Manipulation de chemins de fichiers (extension, nom de base, ...)
  path: ^1.9.0

  # Parseur XML utilise pour lire les fichiers .omap (OpenOrienteering Mapper)
  xml: ^6.5.0

  # Utilitaires de collection (DeepCollectionEquality)
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Le paquet "flutter_lints" contient un ensemble de regles de lint
  # recommandees pour encourager de bonnes pratiques de code.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
