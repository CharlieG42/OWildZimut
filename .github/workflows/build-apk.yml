name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & test (Android APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Gradle wrapper
        run: cd android && flutter precache && cd ..

      # On n'echoue que sur les erreurs. Les avertissements `info`/`warning`
      # pre-existants (ex: use_build_context_synchronously) ne bloquent pas le
      # build tant qu'ils ne sont pas des erreurs.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # Configuration du keystore de signature.
      #
      # Le build.gradle attend un keystore a ../upload-keystore.jks et un
      # fichier key.properties. Si les secrets ne sont pas definis, on genere
      # un keystore auto-signe jetable pour que le build release reussisse
      # (l'APK sera signe mais non distribuable en production).
      #
      # Pour un APK distribuable, definissez dans les secrets du depot :
      #   ANDROID_KEYSTORE_BASE64  -> contenu base64 du fichier .jks
      #   ANDROID_KEY_ALIAS        -> alias de la cle
      #   ANDROID_KEY_PASSWORD     -> mot de passe de la cle
      #   ANDROID_STORE_PASSWORD   -> mot de passe du magasin
      - name: Configure release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Utilisation du keystore de production (secret)."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            STORE_PASS="$ANDROID_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            echo "Aucun keystore fourni : generation d'un keystore jetable."
            keytool -genkeypair -v \
              -keystore android/upload-keystore.jks \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass password \
              -keypass password \
              -dname "CN=OWildZimut CI, OU=Dev, O=OWildZimut, L=Paris, S=Paris, C=FR"
            STORE_PASS="password"
            KEY_ALIAS="upload"
            KEY_PASS="password"
          fi
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
          echo "Keystore release configure."

      - name: Build release APK (with full logs)
        id: build
        run: |
          mkdir -p build_logs
          flutter build apk --release --verbose > build_logs/build.log 2>&1 || true
          echo "BUILD_EXIT_CODE=$?" >> $GITHUB_ENV
          tail -n 100 build_logs/build.log

      - name: Check build result
        run: |
          if [ "$BUILD_EXIT_CODE" != "0" ]; then
            echo "::error::Build failed! Check build_logs/build.log artifact for details."
            exit 1
          fi

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_logs/
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: owildzimut-apk
          path: build/app/outputs/flutter-apk/owildzimut.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/owildzimut.apk
          generate_release_notes: true
