name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & test (Android APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Clean Gradle cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf android/.gradle/

      - name: Generate Gradle wrapper
        run: cd android && flutter precache && cd ..

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Configure release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Utilisation du keystore de production (secret)."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            STORE_PASS="$ANDROID_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            echo "Aucun keystore fourni : generation d'un keystore jetable."
            keytool -genkeypair -v \
              -keystore android/upload-keystore.jks \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass password \
              -keypass password \
              -dname "CN=OWildZimut CI, OU=Dev, O=OWildZimut, L=Paris, S=Paris, C=FR"
            STORE_PASS="password"
            KEY_ALIAS="upload"
            KEY_PASS="password"
          fi
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties

      - name: Build release APK (with full logs)
        id: build
        run: |
          flutter build apk --release --verbose > build.log 2>&1
          BUILD_EXIT_CODE=$?
          echo "BUILD_EXIT_CODE=$BUILD_EXIT_CODE" >> $GITHUB_ENV
          tail -n 100 build.log

      - name: Commit build.log on failure
        if: failure()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add build.log
          git commit -m "CI: Auto-commit build.log for debugging [skip ci]" --allow-empty || true
          git push origin main || true

      - name: Display build.log content on failure
        if: failure()
        run: |
          echo "=== BUILD.LOG CONTENT ==="
          cat build.log || true

      - name: Check build result
        run: |
          if [ "$BUILD_EXIT_CODE" != "0" ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT_CODE! Check build.log in repo root or artifact for details."
            exit $BUILD_EXIT_CODE
          fi

      - name: List all APK files (debug)
        if: success()
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: owildzimut-apk
          path: build/app/outputs/flutter-apk/
          if-no-files-found: warn
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
